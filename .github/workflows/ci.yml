name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint/test tooling
        # Deliberately light: the heavy ML/telephony wheels in requirements.txt
        # are NOT installed here so CI stays fast. Tests are written to avoid
        # importing those deps at collection time.
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.8.4" "pytest==8.3.4" "numpy==1.26.4" \
                      "pandas==2.2.3" "pyyaml==6.0.2"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Pytest
        run: pytest
