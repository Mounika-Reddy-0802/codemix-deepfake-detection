<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Same call, four detectors</title>
  <link rel="stylesheet" href="/static/stage.css" />
  <style>
    main.scene { padding-top: 1.1rem; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .head h1.title { margin: 0; }
    .head p.lede { margin: 0.35rem 0 0; font-size: 1.02rem; }

    /* the two calls the presenter plays, one click each */
    .calls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.25fr); gap: 0.8rem; margin-bottom: 1rem; align-items: stretch; }
    @media (max-width: 1100px) { .calls { grid-template-columns: 1fr; } }
    .callbtn {
      font: inherit; color: var(--ink); text-align: left; cursor: pointer;
      display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.85rem; align-items: center;
      padding: 0.85rem 1rem; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
      transition: border-color 0.15s, background 0.15s, transform 0.08s;
    }
    .callbtn:hover { border-color: var(--line-2); background: var(--panel-2); }
    .callbtn:active { transform: scale(0.99); }
    .callbtn.on { border-color: var(--accent); background: rgba(91, 149, 255, 0.12); }
    .callbtn .ic { grid-row: span 2; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; }
    .callbtn .ic svg { width: 1.15rem; height: 1.15rem; }
    .callbtn.real .ic { background: rgba(34, 201, 122, 0.18); color: #8ff0c0; }
    .callbtn.cloned .ic { background: rgba(255, 79, 79, 0.18); color: #ffa3a3; }
    .callbtn b { font-size: 1.12rem; }
    .callbtn small { color: var(--dim); font-size: 0.84rem; }
    .now { padding: 0.75rem 1rem; display: flex; flex-direction: column; justify-content: center; gap: 0.45rem; }
    .now .top { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
    .now .nt { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .now .clock { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #8fb6ff); }
    .now .ctl { display: flex; align-items: center; gap: 0.5rem; }
    .now .ctl .btn { padding: 0.42rem 0.9rem; font-size: 0.88rem; white-space: nowrap; }
    .now select { font: inherit; font-size: 0.82rem; color: var(--dim); background: #0e1626; border: 1px solid var(--line); border-radius: 999px; padding: 0.38rem 0.7rem; max-width: 15rem; margin-left: auto; }

    /* one big light per detector */
    .lights { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 0.9rem; }
    @media (max-width: 1100px) { .lights { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .lights { grid-template-columns: 1fr; } }
    .det {
      position: relative; overflow: hidden; border-radius: 20px; padding: 1.1rem 1.15rem 1rem;
      background: var(--panel); border: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 0.9rem;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }
    .det::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--lane); }
    .det.s-genuine { border-color: rgba(34, 201, 122, 0.45); }
    .det.s-suspicious { border-color: rgba(255, 176, 46, 0.65); background: rgba(255, 176, 46, 0.06); }
    .det.s-likely_fake { border-color: rgba(255, 79, 79, 0.75); background: rgba(255, 79, 79, 0.08); box-shadow: 0 0 40px rgba(255, 79, 79, 0.16); }
    .det .who b { display: block; font-size: 1.22rem; }
    .det .who small { display: block; color: var(--dim); font-size: 0.82rem; line-height: 1.35; margin-top: 0.15rem; min-height: 2.7em; }
    .det .big { display: flex; align-items: center; gap: 0.85rem; }
    .det .big .light { width: 64px; height: 64px; }
    .det .vword { font-size: min(1.95rem, 38px); font-weight: 800; letter-spacing: -0.3px; line-height: 1.05; white-space: nowrap; }
    .det .times { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .det .times div { background: rgba(0, 0, 0, 0.22); border-radius: 12px; padding: 0.45rem 0.65rem; }
    .det .times span { display: block; color: var(--dim); font-size: 0.74rem; }
    .det .times b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    .det .times .c b { color: #ffd18a; } .det .times .l b { color: #ffa3a3; }
    .det .outcome { font-size: 0.86rem; font-weight: 650; padding: 0.4rem 0.65rem; border-radius: 10px; display: none; }
    .det .outcome.show { display: block; }
    .outcome.good { background: rgba(34, 201, 122, 0.15); color: #92f0c4; }
    .outcome.bad { background: rgba(255, 79, 79, 0.16); color: #ffb3b3; }
    .outcome.warn { background: rgba(255, 176, 46, 0.15); color: #ffd18a; }
    .det .tl canvas { width: 100%; height: 110px; display: block; border-radius: 10px; background: rgba(0, 0, 0, 0.22); }
    .det .tl .thr { color: var(--dim); font-size: 0.76rem; margin-top: 0.3rem; }
    /* details open: each detector becomes a row with its timeline */
    body.details-open .lights { grid-template-columns: 1fr; gap: 0.55rem; }
    body.details-open .det { display: grid; grid-template-columns: 12rem minmax(0, 1fr) 24rem; gap: 1rem; align-items: center; padding: 0.55rem 1rem; }
    body.details-open .det .who small { min-height: 0; }
    body.details-open .det .big { min-width: 10.5rem; }
    body.details-open .det .big .light { width: 24px; height: 24px; }
    body.details-open .det .vword { font-size: 1.15rem; }
    body.details-open .det .side { order: 3; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    body.details-open .det .times { flex: 1; }
    body.details-open .det .times div { padding: 0.25rem 0.5rem; }
    body.details-open .det .times b { font-size: 0.98rem; }
    body.details-open .det .outcome { flex-basis: 100%; padding: 0.25rem 0.55rem; font-size: 0.8rem; }
    body.details-open .det .tl { order: 2; }
    .det .side { display: contents; }
    .legend { display: flex; gap: 1.2rem; flex-wrap: wrap; color: var(--dim); font-size: 0.8rem; margin-top: 0.7rem; }
    .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: #cfd9ea; }
    .legend i.dash { background: repeating-linear-gradient(90deg, #cfd9ea 0 5px, transparent 5px 9px); }
    .empty { padding: 2rem; text-align: center; color: var(--dim); grid-column: 1 / -1; }
    @media (max-height: 820px) and (min-width: 1101px) {
      main.scene { padding-top: 0.7rem; }
      .kicker { margin-bottom: 0.2rem; }
      .head { margin-bottom: 0.6rem; }
      .head p.lede { display: none; }
      .calls { margin-bottom: 0.7rem; }
      .callbtn { padding: 0.6rem 0.85rem; }
      .det { padding: 0.85rem 0.95rem 0.8rem; gap: 0.65rem; }
      .det .big .light { width: 50px; height: 50px; }
      .det .vword { font-size: 1.6rem; }
      body.details-open .det { padding: 0.45rem 0.85rem; }
      body.details-open .det .tl canvas { height: clamp(52px, calc((100vh - 430px) / var(--n, 4) - 22px), 100px); }
      body.details-open .det .who small { display: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <p class="kicker" id="kicker">Scene 2 · One call, every detector</p>
    <div class="head">
      <div>
        <h1 class="title one" id="sentence">Same call, four detectors.</h1>
        <p class="lede muted">Each light is the warning that detector would give the person being called.</p>
      </div>
      <button class="btn details-btn" id="detailsBtn" type="button">Details</button>
    </div>

    <section class="calls" id="calls">
      <div class="card now">
        <div class="top">
          <span id="nowTag"></span>
          <span class="nt" id="nowTitle">Choose a call</span>
          <span class="clock" id="clock">0:00</span>
        </div>
        <div class="progress"><div id="bar"></div></div>
        <div class="ctl">
          <button class="btn go" id="play" disabled>▶ Play</button>
          <button class="btn ghost" id="stop" disabled>Stop</button>
          <select id="otherCalls" aria-label="Other prepared calls"></select>
        </div>
      </div>
    </section>

    <section class="lights" id="lights"><div class="empty card">Loading the detectors…</div></section>
    <div class="legend" data-details hidden>
      <span><i></i> P(genuine), smoothed, one point every 2 s over the last 4 s</span>
      <span><i class="dash"></i> that detector's own frozen threshold</span>
      <span id="ladder"></span>
    </div>
    <audio id="audio" preload="auto"></audio>
  </main>

  <script src="/static/stage.js"></script>
  <script>
    const { make, json, word, nameOf, ABOUT } = Stage;
    Stage.mount("lanes");

    // Scene 2 plays these two, named so the title does not give the answer away
    // (configs/demo_rehearsal.json checks both).
    const FEATURED = [
      { id: "genuine_new_speaker", title: "A genuine caller", sub: "a real person none of them has heard" },
      { id: "tortoise_caught", title: "A Tortoise clone", sub: "a cloning tool none of them was trained on" },
    ];
    const PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const audio = document.getElementById("audio");
    const $ = (id) => document.getElementById(id);
    let clips = [], chosen = null, lanes = [], run = null, seconds = 45, playing = false;
    let showTimelines = false;

    // ------------------------------------------------------------------ calls
    const isFake = (c) => c.label === "spoof";
    const featuredOf = (id) => FEATURED.find((f) => f.id === id);
    const titleOf = (c) => (featuredOf(c.id) || {}).title || c.title;

    async function loadCalls() {
      try {
        clips = await json("/api/demo-clips");
      } catch (e) { Stage.toast("Could not load the prepared calls: " + e.message); return; }
      const box = $("calls");
      const buttons = FEATURED.map((f) => clips.find((c) => c.id === f.id) && make("button", {
        class: "callbtn " + (isFake(clips.find((c) => c.id === f.id)) ? "cloned" : "real"), type: "button",
        onclick: () => { choose(f.id); play(); }, "data-id": f.id,
      }, [make("span", { class: "ic", html: PLAY }), make("b", { text: f.title }), make("small", { text: f.sub })])).filter(Boolean);
      box.prepend(...buttons);
      const others = clips.filter((c) => !featuredOf(c.id));
      $("otherCalls").replaceChildren(make("option", { value: "", text: "Other calls, for questions…" }),
        ...others.map((c) => make("option", { value: c.id, text: `${c.title} (${isFake(c) ? "cloned" : "real"})` })));
      $("otherCalls").onchange = (ev) => ev.target.value && choose(ev.target.value);
      // /lanes?clip=<id> opens on that call (scene 4's known-limit links)
      const wanted = new URLSearchParams(location.search).get("clip");
      if (clips.length) choose(clips.some((c) => c.id === wanted) ? wanted : (featuredOf(clips[0].id) ? FEATURED[0].id : clips[0].id));
    }

    function choose(id) {
      if (playing) stop();
      chosen = clips.find((c) => c.id === id);
      if (!chosen) return;
      document.querySelectorAll(".callbtn").forEach((el) => el.classList.toggle("on", el.dataset.id === id));
      $("otherCalls").value = featuredOf(id) ? "" : id;
      $("nowTag").replaceChildren(make("span", { class: "tag " + (isFake(chosen) ? "cloned" : "real"), text: isFake(chosen) ? "cloned voice" : "real person" }));
      $("nowTitle").textContent = titleOf(chosen);
      $("nowTitle").title = chosen.description || "";
      $("play").disabled = !lanes.length;
      seconds = chosen.seconds || 45;
      audio.src = `/api/demo-clips/${id}/audio`;
      resetLanes();
    }

    // ------------------------------------------------------------------ detectors
    async function loadLanes() {
      try {
        const info = await json("/api/lanes");
        if (info.problems && info.problems.length) Stage.toast(info.problems.join(" · "), 12000);
        lanes = info.lanes.map((l) => ({ ...l, points: [], bands: [], state: "listening", firstCaution: null, firstLikely: null }));
      } catch (e) {
        Stage.toast("Could not read the detectors: " + e.message);
        lanes = [];
      }
      render();
      if (chosen) $("play").disabled = !lanes.length;
    }

    function render() {
      const box = $("lights");
      if (!lanes.length) { box.replaceChildren(make("div", { class: "empty card", text: "No detectors configured (DFD_LANES)." })); return; }
      box.style.setProperty("--n", lanes.length);
      document.body.style.setProperty("--n", lanes.length);
      const count = { 2: "two", 3: "three", 4: "four", 5: "five" }[lanes.length] || String(lanes.length);
      $("sentence").textContent = `Same call, ${count} detectors.`;
      document.title = `Same call, ${count} detectors`;
      Stage.retitle("lanes", count[0].toUpperCase() + count.slice(1) + " detectors");
      const l0 = lanes.find((l) => l.ladder);
      if (l0) $("ladder").textContent = "Each detector warns on its own ladder: caution after a few low windows in a row, likely cloned after more (hover a threshold for its file).";
      box.replaceChildren(...lanes.map((l, i) => {
        const name = nameOf(l.role, l.name);
        const ladder = l.ladder ? ` · caution after ${l.ladder.caution_after} low windows, likely cloned after ${l.ladder.likely_after}` : "";
        return make("section", { class: "det s-listening", id: "det" + i, style: `--lane:${l.colour}` }, [
          make("div", { class: "who" }, [make("b", { text: name }), make("small", { text: ABOUT[l.role] || "" })]),
          make("div", { class: "side" }, [
            make("div", { class: "big" }, [make("span", { class: "light" }), make("span", { class: "vword", id: "vw" + i, text: "Listening" })]),
            make("div", { class: "times" }, [
              make("div", { class: "c" }, [make("span", { text: "First caution" }), make("b", { id: "fc" + i, text: "–" })]),
              make("div", { class: "l" }, [make("span", { text: "Likely cloned" }), make("b", { id: "fl" + i, text: "–" })]),
            ]),
            make("div", { class: "outcome", id: "oc" + i }),
          ]),
          make("div", { class: "tl", "data-details": "", hidden: !showTimelines }, [
            make("canvas", { id: "cv" + i, "aria-label": `${name}: P(genuine) per window` }),
            make("div", { class: "thr" }, ["threshold ",
              make("span", { class: "cite", title: "read from " + (l.threshold_source || "the threshold file"), text: l.threshold !== null ? l.threshold.toFixed(3) : "missing" }),
              ladder]),
          ]),
        ]);
      }));
      drawAll();
    }

    function resetLanes() {
      for (const l of lanes) Object.assign(l, { points: [], bands: [], state: "listening", firstCaution: null, firstLikely: null });
      lanes.forEach((l, i) => {
        if (!$("det" + i)) return;
        $("det" + i).className = "det s-listening";
        $("vw" + i).textContent = "Listening";
        $("fc" + i).textContent = "–";
        $("fl" + i).textContent = "–";
        $("oc" + i).className = "outcome";
      });
      updateClock(0);
      drawAll();
    }

    const secs = (t) => Math.round(t) + " s";
    function setState(i, state, t) {
      const l = lanes[i];
      if (state === l.state) return;
      l.state = state;
      if (state === "suspicious" || state === "likely_fake") {
        if (l.firstCaution === null) { l.firstCaution = t; $("fc" + i).textContent = secs(t); }
        if (state === "likely_fake" && l.firstLikely === null) { l.firstLikely = t; $("fl" + i).textContent = secs(t); }
      }
      l.bands.push({ t, state });
      $("det" + i).className = "det s-" + state;
      $("vw" + i).textContent = word(state);
    }

    // At the end of the call each detector shows the strongest warning it gave, not where
    // its light happened to settle: a receiver who was told "likely cloned" was told so.
    function outcome(i, summary) {
      const truth = chosen && chosen.label;
      const l = lanes[i], peak = summary.peak_state;
      $("det" + i).className = "det s-" + peak;
      $("vw" + i).textContent = word(peak);
      $("fc" + i).textContent = summary.first_caution_s !== null ? secs(summary.first_caution_s) : "none";
      $("fl" + i).textContent = summary.first_likely_s !== null ? secs(summary.first_likely_s) : "none";
      let cls, text;
      if (truth === "bonafide") {
        [cls, text] = peak === "genuine" ? ["good", "✓ let the real caller through"]
          : peak === "suspicious" ? ["warn", "cautioned a real caller"]
          : ["bad", "✗ called a real caller cloned"];
      } else if (l.role === "s1" && peak !== "genuine") {
        // the English-only detector warns on every Hindi-English call, real or cloned
        [cls, text] = ["warn", "warned, but it warns real callers too"];
      } else {
        [cls, text] = peak === "likely_fake" ? ["good", `✓ caught the clone at ${secs(summary.first_likely_s ?? 0)}`]
          : peak === "suspicious" ? ["warn", "only a caution, never a warning"]
          : ["bad", "✗ missed the clone"];
      }
      $("oc" + i).className = "outcome show " + cls;
      $("oc" + i).textContent = text;
    }

    // ------------------------------------------------------------------ timelines (Details)
    const STATE_FILL = { suspicious: "rgba(255,176,46,0.22)", likely_fake: "rgba(255,79,79,0.26)" };
    function draw(i) {
      const l = lanes[i], c = $("cv" + i);
      if (!c || !showTimelines) return;
      const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
      if (!w || !h) return;
      c.width = w * dpr; c.height = h * dpr;
      const ctx = c.getContext("2d");
      ctx.scale(dpr, dpr);
      const padL = 32, padR = 10, padT = 8, padB = 18;
      const x = (t) => padL + (w - padL - padR) * Math.min(1, t / seconds);
      const y = (v) => padT + (h - padT - padB) * (1 - v);
      l.bands.forEach((b, k) => {
        const end = k + 1 < l.bands.length ? l.bands[k + 1].t : (playing ? audio.currentTime : (l.points.at(-1)?.t ?? b.t));
        if (!STATE_FILL[b.state]) return;
        ctx.fillStyle = STATE_FILL[b.state];
        ctx.fillRect(x(b.t), padT, Math.max(2, x(end) - x(b.t)), h - padT - padB);
      });
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.strokeStyle = "rgba(255,255,255,0.07)"; ctx.fillStyle = "rgba(200,214,236,0.55)";
      for (const v of [0, 0.5, 1]) {
        ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(w - padR, y(v)); ctx.stroke();
        ctx.fillText(v.toFixed(1), 4, y(v) + 4);
      }
      for (let t = 0; t <= seconds; t += 10) ctx.fillText(t + " s", x(t) - 8, h - 4);
      if (l.threshold !== null) {
        ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(230,238,250,0.75)"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(padL, y(l.threshold)); ctx.lineTo(w - padR, y(l.threshold)); ctx.stroke();
        ctx.setLineDash([]); ctx.lineWidth = 1;
      }
      const scored = l.points.filter((p) => p.score !== null);
      ctx.fillStyle = l.colour + "88";
      for (const p of scored) { ctx.beginPath(); ctx.arc(x(p.t), y(p.score), 3, 0, 7); ctx.fill(); }
      const smooth = l.points.filter((p) => p.smoothed !== null && p.smoothed !== undefined);
      if (smooth.length) {
        ctx.strokeStyle = l.colour; ctx.lineWidth = 3; ctx.lineJoin = "round";
        ctx.beginPath();
        smooth.forEach((p, k) => (k ? ctx.lineTo(x(p.t), y(p.smoothed)) : ctx.moveTo(x(p.t), y(p.smoothed))));
        ctx.stroke(); ctx.lineWidth = 1;
        const last = smooth.at(-1);
        ctx.fillStyle = l.colour; ctx.beginPath(); ctx.arc(x(last.t), y(last.smoothed), 5, 0, 7); ctx.fill();
      }
      if (playing || audio.currentTime > 0) {
        ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x(audio.currentTime), padT - 4); ctx.lineTo(x(audio.currentTime), h - padB); ctx.stroke();
        ctx.lineWidth = 1;
      }
    }
    function drawAll() { lanes.forEach((_, i) => draw(i)); }
    function updateClock(t) {
      const m = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
      $("clock").textContent = m(t) + " / " + m(seconds);
      $("bar").style.width = Math.min(100, (100 * t) / seconds) + "%";
    }
    function tick() {
      updateClock(audio.currentTime || 0);
      drawAll();
      if (playing) requestAnimationFrame(tick);
    }
    window.addEventListener("resize", drawAll);
    Stage.details($("detailsBtn"), document, (open) => { showTimelines = open; requestAnimationFrame(drawAll); });

    // ------------------------------------------------------------------ playing
    async function play() {
      if (!chosen || !lanes.length || playing) return;
      resetLanes();
      $("play").disabled = true;
      try {
        const started = await json(`/api/replay_lanes/${chosen.id}`, { method: "POST" });
        run = started.run;
        seconds = started.seconds || seconds;
        audio.currentTime = 0;
        await audio.play().catch(() => {});
        playing = true;
        $("stop").disabled = false;
        requestAnimationFrame(tick);
      } catch (e) {
        Stage.toast("Could not start the call: " + e.message, 12000);
        $("play").disabled = false;
      }
    }
    async function stop() {
      playing = false;
      audio.pause();
      try { await json("/api/replay_lanes_stop", { method: "POST" }); } catch (e) { /* already ended */ }
      finish();
    }
    function finish() {
      playing = false;
      $("play").disabled = !chosen;
      $("stop").disabled = true;
      drawAll();
    }

    Stage.socket((m) => {
      if (!run || m.run !== run) return;
      if (m.type === "lane_window") {
        const i = m.lane_index;
        if (!lanes[i]) return;
        lanes[i].points.push({ t: m.t, score: m.score, smoothed: m.smoothed });
        if (m.score !== null) setState(i, m.state, m.t);
        draw(i);
      } else if (m.type === "lanes_end") {
        m.lanes.forEach((s, i) => { if (lanes[i]) outcome(i, s); });
        if (audio.ended || audio.paused) finish();
      } else if (m.type === "lanes_error") {
        Stage.toast("Scoring failed: " + m.error, 12000);
        finish();
      }
    });
    audio.addEventListener("ended", () => { if (playing) finish(); });

    $("play").onclick = play;
    $("stop").onclick = stop;
    document.addEventListener("keydown", (ev) => {
      if (ev.code === "Space" && !ev.target.closest("input, select, textarea, button")) {
        ev.preventDefault();
        playing ? stop() : play();
      }
    });

    loadLanes().then(loadCalls);
  </script>
</body>
</html>
