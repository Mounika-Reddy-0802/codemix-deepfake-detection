[project]
name = "codemix-deepfake-detection"
version = "0.1.0"
description = "Quantifying and closing the code-mixing generalisation gap in audio deepfake detection"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks", "data", "checkpoints", "paper", "report"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter, not enforced hard

[tool.pytest.ini_options]
# Make `import src...` work without installing the package, and keep tests fast.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
