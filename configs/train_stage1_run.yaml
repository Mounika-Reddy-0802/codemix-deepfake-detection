# Stage-1 baseline: fine-tune on ASVspoof 2019 LA (English ONLY). Week 3/4, owner M.
# GOLDEN RULE: Stage-1 trains on ASVspoof 2019 LA only. No Indic/code-mixed/Tortoise
# data in these manifests (enforced by tests/test_splits.py).

encoder: wav2vec2-base        # wav2vec2-base | wavlm-base | xlsr-53

train_manifest: data/manifests/asvspoof_train.csv
dev_manifest: data/manifests/asvspoof_dev.csv
out_dir: checkpoints/baseline

# optimisation
# 1e-5, not 1e-4. A pretrained wav2vec2 transformer is being fine-tuned, and
# 1e-4 destroys its representations within a few hundred steps: the first 3-epoch
# run collapsed to a CONSTANT output (score std 0.0000, zero class separation),
# loss pinned at 0.329 -- exactly the always-predict-spoof value -- and dev EER
# wandered 0.52/0.48/0.49 for 210 minutes. At 1e-5 the same pipeline reached
# EER 0.047 in 300 steps on 6% of the data.
lr: 1.0e-5
weight_decay: 1.0e-5
batch_size: 4
# Clip length cap. collate pads every clip in a batch up to the longest one, so
# peak VRAM is set by the unluckiest batch, not the average: ASVspoof clips reach
# 8.5 s, so a batch of 8 could carry 68 s of audio in one forward pass and sat at
# 5,973 of 6,144 MiB -- 97% of this card, with nothing left for a spike. 4 s is
# also the length anti-spoofing models are conventionally trained on.
max_seconds: 4.0
epochs: 3
# 0, not 2, and this is a stability fix rather than a tuning choice. On Windows
# every DataLoader worker is a SPAWNED process that re-imports torch and commits
# ~2-3 GB of CUDA DLLs of its own. On this 16 GB / 6 GB-VRAM laptop that exhausted
# the commit charge and the run died with "[WinError 1455] The paging file is too
# small ... loading cublas64_12.dll" -- and the same exhaustion is why crash dumps
# could not be written, leaving C:\Windows\Minidump empty after each shutdown.
# Loading is single-process now; it costs a little throughput and changes no
# result, since worker count is not a hyperparameter.
num_workers: 0
seed: 1234
amp: true

# encoder freezing (CNN feature extractor frozen; transformer fine-tuned)
freeze_feature_extractor: true
freeze_encoder: false

# smoke test: set subset_frac=0.01 + max_steps=20 (or pass --smoke) to verify the
# loop learns on a 1% subset before spending GPU hours.
subset_frac: 1.0
max_steps: null

# --- portability: same file on the CPU laptop and on a Colab/Kaggle GPU --------
# device: null/"auto" detects (cuda -> mps -> cpu). "cpu" forces a laptop smoke
#   run; "cuda" makes the run FAIL LOUDLY if no GPU is attached, which is what you
#   want on Colab. $DFD_DEVICE and --device override this.
device: cuda
# data_root: where this machine keeps data/ (C:/dfdata here, /content/data on
#   Colab). Manifest clip paths are rebased onto it, so a frozen manifest is never
#   edited to move machines. $DATA_ROOT and --data-root override this.
data_root: null

wandb_project: codemix-deepfake-detection
wandb_mode: offline
